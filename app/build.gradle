plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv('LANCAM_KEYSTORE_FILE')
def releasePassword = System.getenv('LANCAM_KEYSTORE_PASSWORD')

android {
    namespace 'com.example.lancam'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.lancam'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.2.1'
    }

    signingConfigs {
        release {
            if (releaseKeystore && releasePassword) {
                storeFile file(releaseKeystore)
                storePassword releasePassword
                keyAlias 'lancam'
                keyPassword releasePassword
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystore && releasePassword) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
