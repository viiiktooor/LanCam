name: Publish LanCam Release

on:
  push:
    branches: [ main ]
    paths:
      - 'release/version.txt'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "ANDROID_KEYSTORE_BASE64 secret is missing" && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lancam-release.jks"
      - name: Build signed Android release
        env:
          LANCAM_KEYSTORE_FILE: ${{ runner.temp }}/lancam-release.jks
          LANCAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$LANCAM_KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD secret is missing" && exit 1)
          gradle --no-daemon verifyFramePipeline lintRelease assembleRelease
          VERSION=$(grep "versionName" app/build.gradle | head -1 | sed -E "s/.*'([^']+)'.*/\1/")
          cp app/build/outputs/apk/release/app-release.apk "LanCam-Android-$VERSION.apk"
      - name: Verify existing Android signing certificate
        run: |
          curl --fail --location --retry 3 \
            https://github.com/viiiktooor/LanCam/releases/download/v1.2.1/LanCam-Android-1.2.1.apk \
            --output "$RUNNER_TEMP/official.apk"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" verify --print-certs "$RUNNER_TEMP/official.apk" > "$RUNNER_TEMP/official-cert.txt"
          "$SIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/new-cert.txt"
          EXPECTED=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/official-cert.txt")
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/new-cert.txt")
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: LanCam-Android-*.apk
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/lancam-release.jks"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller
      - name: Test Windows client
        run: python -m unittest discover -s desktop -p "test_*.py"
      - name: Build Windows client
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LanCamClient desktop/LanCamClient.py
          $version = (Select-String -Path desktop/LanCamClient.py -Pattern '^APP_VERSION = "([0-9.]+)"').Matches.Groups[1].Value
          Copy-Item dist/LanCamClient.exe "LanCamClient-$version.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: LanCamClient-*.exe

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < release/version.txt)
          (cd release-assets && sha256sum *.apk *.exe > SHA256SUMS.txt)
          gh release create "v$VERSION" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "LanCam $VERSION" \
            --notes-file release/NOTES.md \
            --latest
