name: Build Windows Client

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller

      - name: Build LanCam Client
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LanCamClient desktop/LanCamClient.py

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: LanCam-Windows-Client-0.2.0
          path: dist/LanCamClient.exe
          if-no-files-found: error
